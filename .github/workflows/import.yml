name: import tool

on:
  push:
    branches: [next2]
    paths:
      - 'import/**'
      - 'v2/src/**'
      - 'eslint.config.mjs'
      - '.github/workflows/import.yml'
  pull_request:
    branches: [next2]
    paths:
      - 'import/**'
      - 'v2/src/**'
      - 'eslint.config.mjs'
      - '.github/workflows/import.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix import
      - name: Typecheck
        run: npm --prefix import run typecheck
      - name: Lint
        run: npm --prefix import run lint
      - name: Test
        run: npm --prefix import test
      - name: Suite sample
        run: node import/scripts/measure.ts --sample
      - name: Mutation sample
        run: node import/scripts/mutate.ts --sample
