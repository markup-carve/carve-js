name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

# Every job declares timeout-minutes so a hung step fails in minutes
# rather than inheriting the 360-minute GitHub default.

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A required reviewer approves before this runs (markup-carve/carve#2032).
    environment: release
    permissions:
      # `write`, not `read`, and the gate below is the whole reason: a DRAFT
      # release is invisible to a caller without push access, so under
      # `contents: read` the listing comes back empty and the gate reports
      # "no release" for a draft that is sitting right there with notes in
      # it. See markup-carve/carve-wasm#80.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          submodules: recursive # spec corpus submodule; npm test needs it
          # The completeness gate below walks every merge back to the previous
          # tag, so it needs the tags and the history behind them.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # The draft must describe the tagged changelog section before publishing.
      # Relative changelog links resolve against this tag in the release body.
      # rehearse-release-notes.yml runs the same script against a draft.
      - name: The release notes match this tag's changelog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/run-release-notes-gate.sh "$GITHUB_REF_NAME"

      # Guard: package.json version AND the CHANGELOG must match the release
      # tag, so a mistyped tag, a forgotten version bump, or an un-cut changelog
      # cannot publish the wrong version. (carve-rs has the equivalent guard.)
      - name: Verify version and changelog match the tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="$(node -p "require('./package.json').version")"
          # The trigger already filters on X.Y.Z; this holds if that filter widens.
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag $TAG is not a plain X.Y.Z version. A -dev or other prerelease version never publishes."
            exit 1
          fi
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VER."
            exit 1
          fi
          if ! grep -qE "^## \[?${TAG//./\\.}\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$TAG]' section; cut it from [Unreleased] before tagging."
            exit 1
          fi

      # ...and the section describes ALL of it. The step above passes on a
      # section covering 3 of 24 merges, which is how three engines came to
      # carry a changelog written on cut day and never reopened. Runs before
      # anything publishes, and names every missing pull request at once.
      - name: The changelog section accounts for every merge in this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/changelog-completeness.mjs "${GITHUB_REF_NAME}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

      # The browser bundle is built here rather than in `prepare`, so that a
      # git-dependency install (the spec repo pins this package by commit)
      # neither builds it nor downloads a bundler for it. `npm publish` re-runs
      # `prepare`, and tsc leaves files it did not emit alone, so the artifact
      # written here survives into the tarball that unpkg and jsdelivr serve.
      # This step also verifies it against the ESM build before publishing.
      - name: Build and verify the browser bundle
        run: npm run test:browser

      # Publish authenticates via the NPM_TOKEN repo secret (a granular token
      # with read/write on the @markup-carve scope). setup-node already wrote
      # the registry .npmrc; NODE_AUTH_TOKEN supplies the credential.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      # A registry publish is not finished until the release page exists. The
      # tag is pushed, CI publishes, the registry answers 200, and "released"
      # feels done - while `/releases` still shows a draft, so a reader has no
      # notes and no changelog for the version they just installed. Doing it
      # here rather than by hand also means the draft stops being a thing
      # someone has to remember to publish at the right moment.
      #
      # Last, deliberately: a draft that stays a draft is recoverable, and one
      # published beside a failed publish is not.
      - name: Publish the release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/run-release-notes-gate.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/release.json"
          release="$(cat "$RUNNER_TEMP/release.json")"
          id="$(printf '%s' "$release" | jq -r 'select(.draft) | .id // empty')"
          if [ -z "$id" ]; then
            echo "The release is already published."
            exit 0
          fi
          # `tag_name` goes with every PATCH of a release. Omit it on a DRAFT
          # and GitHub replaces the tag with a generated `untagged-*`
          # placeholder, because a draft's tag is a string on the object rather
          # than a git ref - so the field has nothing to fall back to.
          # `-F` (not `-f`) for draft, so it is sent as a boolean.
          gh api "repos/$GITHUB_REPOSITORY/releases/$id" -X PATCH \
            -f tag_name="$GITHUB_REF_NAME" -F draft=false --jq '"published \(.tag_name)"'
          # Read it back: exit status does not tell you whether the tag survived.
          gh api "repos/$GITHUB_REPOSITORY/releases/$id" \
            --jq '"draft=\(.draft) tag=\(.tag_name)"'
