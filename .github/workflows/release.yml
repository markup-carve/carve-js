name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # GATE: the notes are not the workflow's to write. A CHANGELOG entry is
      # deliberately one or two lines for a contributor, which makes poor
      # release notes for a reader deciding whether to upgrade. A human writes
      # the draft first and this refuses to publish without one.
      #
      # Found by listing rather than `gh release view <tag>`: a draft's tag is
      # not a git ref, so addressing one by tag can match nothing, change
      # nothing and still exit 0.
      - name: A release draft for this tag exists and has notes
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")] | first")"
          if [ -z "$release" ]; then
            echo "::error::no release for $GITHUB_REF_NAME. Write the notes first:" \
                 "gh release create $GITHUB_REF_NAME --draft --notes-file NOTES.md"
            exit 1
          fi
          body="$(printf '%s' "$release" | jq -r '.body // ""' | tr -d '[:space:]')"
          [ -n "$body" ] \
            || { echo "::error::the release for $GITHUB_REF_NAME has no notes"; exit 1; }
          printf '%s' "$release" | jq -r '"draft=\(.draft) tag=\(.tag_name)"'

      - uses: actions/checkout@v4
        with:
          submodules: recursive # spec corpus submodule; npm test needs it

      # Guard: package.json version AND the CHANGELOG must match the release
      # tag, so a mistyped tag, a forgotten version bump, or an un-cut changelog
      # cannot publish the wrong version. (carve-rs has the equivalent guard.)
      - name: Verify version and changelog match the tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VER."
            exit 1
          fi
          if ! grep -qE "^## \[?${TAG//./\\.}\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$TAG]' section; cut it from [Unreleased] before tagging."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

      # The browser bundle is built here rather than in `prepare`, so that a
      # git-dependency install (the spec repo pins this package by commit)
      # neither builds it nor downloads a bundler for it. `npm publish` re-runs
      # `prepare`, and tsc leaves files it did not emit alone, so the artifact
      # written here survives into the tarball that unpkg and jsdelivr serve.
      # This step also verifies it against the ESM build before publishing.
      - name: Build and verify the browser bundle
        run: npm run test:browser

      # Publish authenticates via the NPM_TOKEN repo secret (a granular token
      # with read/write on the @markup-carve scope). setup-node already wrote
      # the registry .npmrc; NODE_AUTH_TOKEN supplies the credential.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
