name: Published engine drift

# Nine repositories install `@markup-carve/carve` from npm, so what they ship is
# whatever was last published. Nothing measured the distance between that and
# main until someone audited it by hand and found 176 commits and 38 corpus
# documents (markup-carve/carve#608). Their own CI cannot see it: their tests
# pass against the engine they installed.
#
# This job measures it on a schedule and holds it to a number committed in the
# repo. Green while the drift matches `published-drift.baseline`; red when it
# moves in EITHER direction - growing means a release is due, shrinking means a
# release happened without resetting the baseline.

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # the spec corpus both engines are run over
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/published-drift.mjs
