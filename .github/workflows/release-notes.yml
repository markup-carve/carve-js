name: Release notes check

on:
  pull_request:
    paths:
      - 'tools/check-release-notes.py'
      - 'tools/test-release-notes.py'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-notes.yml'
  push:
    branches: [main]
    paths:
      - 'tools/check-release-notes.py'
      - 'tools/test-release-notes.py'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-notes.yml'

permissions:
  contents: read

# Every job declares timeout-minutes so a hung step fails in minutes
# rather than inheriting the 360-minute GitHub default.

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Check release-note comparison and rejection cases
        run: python3 tools/test-release-notes.py
