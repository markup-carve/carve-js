name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + corpus
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Corpus tests
        run: npm test

      - name: Build
        run: npm run build

  perf:
    name: scaling guards
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Skipped in the everyday suite: these are the only tests whose outcome
      # depends on what else the machine is doing, and vitest runs files
      # concurrently, so in the default run they measure each other. Here they
      # get a runner to themselves, with file parallelism off.
      - name: Scaling guards
        run: npm run test:perf

  browser-bundle:
    name: browser bundle parity

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # the parity check renders the spec corpus
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Builds dist/carve.iife.min.js and asserts it renders identically to
      # the ESM build. esbuild is fetched by npx at the version pinned in
      # scripts/build-browser.mjs, so it stays out of devDependencies and off
      # every git-dependency install. Roughly two seconds, hence per-PR.
      - name: Bundle parity
        run: npm run test:browser

  mxss:
    name: browser mutation-XSS (svg fence)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Playwright + chromium are needed only for this job, so install them here
      # rather than as a project devDependency (keeps the main matrix light).
      - name: Install Playwright chromium
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      - name: Browser mutation-XSS check
        run: npm run test:mxss
