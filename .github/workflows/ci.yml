name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '40 4 * * *'
  workflow_dispatch:

# PRs cancel their own superseded runs; every other event gets a unique group,
# because GitHub keeps only one pending run per group and would drop main pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job declares timeout-minutes so a hung step fails in minutes
# rather than inheriting the 360-minute GitHub default.

jobs:
  git-consumer:
    name: git dependency consumer on Node ${{ matrix.node-version }}
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install and import from a git dependency
        run: |
          consumer="$(mktemp -d)"
          cd "$consumer"
          printf '{"private":true,"type":"module"}\n' > package.json
          npm install --no-audit --no-fund "git+file://${GITHUB_WORKSPACE}"
          node --input-type=module -e "import { render } from '@markup-carve/carve'; if (!render('hello').includes('hello')) process.exit(1)"

  mutation:
    name: parser and HTML mutation gate
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/mutation-gate.mjs --base=origin/main

  # THE PIN RESOLVES BY SHA, SO NOTHING ELSE HERE CAN SEE A DANGLING ONE. Every
  # other job checks the spec submodule out and runs against whatever tree the
  # pin names, which works just as well for a commit that is not on the lane's spec branch
  # as for one that is - right up until the commit is collected and the checkout
  # itself starts failing (markup-carve/carve#1740). Seconds, so it runs first
  # and on every PR.
  #
  # REACHABLE IS ALL IT MEANS, which is why the job is named for that and not
  # for currency. A commit five hundred behind is reachable too, so a green run
  # here says nothing about which spec this engine implements. Whether the three
  # engines pin the SAME commit is the spec repo's
  # scripts/fleet-spec-pin-check.mjs, run from pre-tag-check.sh at tag time.
  spec-pin:
    name: spec pin is reachable from the matching spec branch
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Spec pin ancestry
        env:
          SPEC_DEFAULT_BRANCH: main
        run: ./scripts/check-spec-pin-ancestry.sh spec

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Public declarations with both TypeScript versions
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: npm run check-public-types
      - run: npm run test:cli

      - name: Git dependency archive builds
        run: npm run test:archive

  test:
    name: tests (${{ matrix.node-version }}, shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # Pull requests run Node 24 only; main pushes and the nightly run add 22.
        node-version: ${{ fromJSON(github.event_name == 'pull_request' && '[24]' || '[22, 24]') }}
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # Vitest splits the test files between the two shards; together they
      # run exactly the files `npm test` runs.
      - name: Corpus tests
        run: npx vitest run --shard=${{ matrix.shard }}/2

      - name: Build
        if: matrix.shard == 1
        run: npm run build

      - name: Packed package consumer
        if: matrix.shard == 1
        run: npm run test:package

  lint-suite:
    name: lint suite
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:lint

  migrate-suite:
    name: migration suite
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:migrate

  proptest-suite:
    name: property regression suite
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix import --ignore-scripts
      - run: npm run test:proptest

  browser-bundle:
    name: browser bundle parity

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # the parity check renders the spec corpus
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Builds dist/carve.iife.min.js and asserts it renders identically to
      # the ESM build. esbuild is fetched by npx at the version pinned in
      # scripts/build-browser.mjs, so it stays out of devDependencies and off
      # every git-dependency install. Roughly two seconds, hence per-PR.
      - name: Bundle parity
        run: npm run test:browser
